name: 打包安卓Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持手动点击一键打包
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码
      - uses: actions/checkout@v4
      
      # 安卓开发必需：设置JDK17
      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 给Gradle执行权限（必加，否则打包会失败）
      - name: 赋予Gradle执行权限
        run: chmod +x gradlew

      # 构建Release正式版APK
      - name: 构建Release APK
        run: ./gradlew assembleRelease

      # 自动上传生成好的APK，打包完成可直接下载
      - name: 上传Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
